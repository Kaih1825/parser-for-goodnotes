name: Auto Update Asset SVGs

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "assets/*.goodnotes"
      - "scripts/update_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Re-render asset SVGs
        run: uv run python scripts/update_assets.py

      - name: Commit and push updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No changes in asset SVGs detected."
          else
            git commit -m "chore(assets): auto re-render sample SVGs [skip ci]"
            git push
          fi

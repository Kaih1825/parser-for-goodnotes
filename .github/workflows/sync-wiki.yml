name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          WIKI_DIR=$(mktemp -d)
          WIKI_REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          echo "Cloning GitHub Wiki repository..."
          if ! git clone "${WIKI_REPO_URL}" "${WIKI_DIR}"; then
            echo "::error::Failed to clone wiki repository. Please ensure Wiki is enabled in Settings -> Features -> Wikis and that you have clicked 'Create the first page' on GitHub web UI."
            exit 1
          fi

          echo "Copying wiki documents..."
          cp -r wiki/* "${WIKI_DIR}/"

          # GitHub Wiki entry page is Home.md
          if [ -f "${WIKI_DIR}/README.md" ]; then
            cp "${WIKI_DIR}/README.md" "${WIKI_DIR}/Home.md"
          fi

          cd "${WIKI_DIR}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes detected in Wiki. Skipping commit and push."
          else
            git commit -m "docs: auto-sync wiki documentation [skip ci]"
            # GitHub wiki default branch is usually master
            git push origin master || git push origin main
            echo "Successfully pushed updates to GitHub Wiki!"
          fi

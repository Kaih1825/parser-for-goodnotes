[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "goodnotes-document-parser"
version = "0.1.0"
description = "A typed, schema-free protobuf inspector and exporter for GoodNotes documents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Document Parser for GoodNotes contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
    "cairosvg>=2.8.2",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gn-inspect = "goodnotes_re.cli:inspect_main"
gn-dump = "goodnotes_re.cli:dump_main"
gn-diff = "goodnotes_re.cli:diff_main"
gn-recordings = "goodnotes_re.cli:recordings_main"
gn-export-audio = "goodnotes_re.cli:export_audio_main"
gn-export-video = "goodnotes_re.cli:export_video_main"
gn-export-html = "goodnotes_re.cli:export_html_main"
gn-export-json = "goodnotes_re.cli:export_json_main"
gn-export-svg = "goodnotes_re.cli:export_svg_main"
gn-export-pdf = "goodnotes_re.cli:export_pdf_main"

[tool.hatch.build.targets.wheel]
packages = ["src/goodnotes_re"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = false
warn_return_any = false
